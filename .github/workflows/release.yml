name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Release version (e.g., v1.2.3). Leave empty to auto-increment
          the patch version from the latest git tag.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_KEYSTORE_PASSWORD \
                      SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            if [[ "$INPUT_VERSION" != v* ]]; then
              INPUT_VERSION="v${INPUT_VERSION}"
            fi
            VERSION="$INPUT_VERSION"
          else
            LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -n 1)

            if [ -z "$LATEST_TAG" ]; then
              VERSION="v0.0.1"
            else
              VERSION_BODY="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_BODY"
              PATCH=$((PATCH + 1))
              VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION#v}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "Resolved version: $VERSION (versionCode $VERSION_CODE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ./gradlew assembleRelease \
            "-PversionName=${VERSION#v}" \
            "-PversionCode=${{ steps.version.outputs.version_code }}"

      - name: Rename APK
        id: rename
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "$SIGNED_APK" ]; then
            APK_SOURCE="$SIGNED_APK"
          elif [ -f "$UNSIGNED_APK" ]; then
            echo "::error::Build produced an unsigned APK. Check that the signing secrets are valid."
            exit 1
          else
            echo "::error::No APK found at expected paths."
            exit 1
          fi
          DEST="app/build/outputs/apk/release/gpslog-${VERSION}.apk"
          mv "$APK_SOURCE" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.rename.outputs.apk_path }}
